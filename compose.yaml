services:
  db:
    image: mysql:8.4
    container_name: animelist-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: animelist
      MYSQL_USER: animelist_user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - animelist_data:/var/lib/mysql

volumes:
  animelist_data:
