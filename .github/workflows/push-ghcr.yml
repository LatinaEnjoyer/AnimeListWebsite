name: push-ghcr.yml
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  java-test:
    uses: ./.github/workflows/java-tests.yml



  build-and-push:
    needs: java-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@601a80b39c9405e50806ae38af30926f9d957c47
        with:
          context: .
          push: true
          tags: ghcr.io/latinaenjoyer/animelistwebsite:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}