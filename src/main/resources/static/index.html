<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main>
    <section class="filter">
        <div class="filter-header-container">
            <h2 id="filter-header">Filter</h2>
        </div>
    </section>

    <div class="anime-list-container">
        <section class="title-header">
            <div class="add-button-container">
                <button id="add-btn">Add anime</button>
            </div>

            <div class="list-header-container">
                <h1 id="list-header">My Watchlist</h1>
            </div>

            <div class="space"></div>
        </section>

        <section class="anime-section">
            <ul class="anime-list">

            </ul>
        </section>
    </div>

    <section class="stats-section">
        <section>
            <div class="stats-header-container">
                <h2 id="stats-header">Statistics</h2>
            </div>

            <div class="stats">

            </div>
        </section>
    </section>
</main>

<section class="create-box-container hidden">
    <div class="create-box">
        <div class="create-header-container">
            <h2>Create Anime</h2>
        </div>
        <hr>
        <form class="create-anime-form">
            <div class="input-container">
                <section class="input-section">
                    <div class="input-box">
                        <label for="title">Title</label>
                        <input required type="text" name="title" id="title">
                    </div>

                    <div class="input-box">
                        <label for="status">Status</label>
                        <select required name="status" id="status">
                            <option value="" selected disabled>Choose Status</option>
                            <option value="COMPLETED">Completed</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="DROPPED">Dropped</option>
                            <option value="ON_HOLD">On Hold</option>
                            <option value="PLANNING_TO_WATCH">Planning To Watch</option>
                        </select>
                    </div>
                </section>

                <section class="input-section">
                    <div class="input-box">
                        <label for="score">Score</label>
                        <select name="score" id="score">
                            <option value="" selected disabled>Choose Score</option>
                            <option value="10">(10) Masterpiece</option>
                            <option value="9">(9) Great</option>
                            <option value="8">(8) Very Good</option>
                            <option value="7">(7) Good</option>
                            <option value="6">(6) Fine</option>
                            <option value="5">(5) Average</option>
                            <option value="4">(4) Bad</option>
                            <option value="3">(3) Very Bad</option>
                            <option value="2">(2) Horrible</option>
                            <option value="1">(1) Appalling</option>
                        </select>
                    </div>

                    <div class="input-box">
                        <label for="progress">Progress</label>
                        <input type="number" name="progress" id="progress">
                    </div>
                </section>
            </div>

            <section class="add-form-btn-container">
                <button type="submit">Submit</button>
            </section>
        </form>
    </div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
